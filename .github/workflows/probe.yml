name: LeetCode connectivity probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch today's challenge
        run: |
          uv run python - <<'PY'
          from scripts.leetcode_client import get_daily_challenge

          data = get_daily_challenge()
          print(f"OK {data['date']} #{data['id']} {data['title']}")
          PY
