services:
  postgres:
    image: postgres:16-alpine
    container_name: leetcode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leetcode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leetcode_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-leetcode_analytics}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leetcode} -d ${POSTGRES_DB:-leetcode_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
